<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- このページ自体は外部と通信しません。各アプリの通信設定は、それぞれのアプリの index.html に従います -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; frame-src 'self'; img-src 'self' data:; connect-src 'none'; form-action 'none'; object-src 'none'; base-uri 'none'">
<title>業務アプリ</title>
<style>
:root{
  --bar:#24364b; --bar-ink:#e6edf5; --tab-hover:#33495f;
  --active-bg:#f4f6f8; --active-ink:#1f2933; --accent:#3d8bd9;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#f4f6f8}
body{display:flex;flex-direction:column;
  font:14px/1.4 "Yu Gothic UI","Meiryo UI","Hiragino Kaku Gothic ProN",sans-serif}
nav{flex:0 0 auto;display:flex;align-items:flex-end;gap:2px;background:var(--bar);
  padding:6px 8px 0;overflow-x:auto;scrollbar-width:thin}
/* 左上のアプリ名：タブと見分けがつくよう、アイコン付きの見出しにして区切り線で分ける */
nav .brand{flex:0 0 auto;align-self:center;display:flex;align-items:center;gap:8px;
  margin:0 10px 6px 2px;padding:0 14px 0 0;border-right:1px solid rgba(255,255,255,.22);
  color:#fff;font-size:15px;font-weight:700;letter-spacing:.06em;white-space:nowrap;
  cursor:default;user-select:none;-webkit-user-select:none}
nav .brand-icon{display:grid;place-items:center;width:26px;height:26px;border-radius:7px;
  background:var(--accent);box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
nav .brand-icon svg{display:block}
nav button{appearance:none;border:0;border-radius:6px 6px 0 0;background:transparent;
  color:var(--bar-ink);font:inherit;font-weight:600;padding:8px 16px 9px;cursor:pointer;
  white-space:nowrap;border-top:3px solid transparent}
nav button:hover{background:var(--tab-hover)}
nav button[aria-selected="true"]{background:var(--active-bg);color:var(--active-ink);
  border-top-color:var(--accent)}
nav button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
/* タブの並べ替え（ドラッグ） */
nav button.tab{position:relative;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
nav button.tab.dragging{z-index:2;cursor:grabbing;box-shadow:0 4px 14px rgba(0,0,0,.35);
  background:var(--tab-hover);color:var(--bar-ink)}
nav button.tab.dragging[aria-selected="true"]{background:var(--active-bg);color:var(--active-ink)}
nav.reordering button.tab:not(.dragging){transition:transform .15s ease}
nav.reordering{cursor:grabbing}
nav .reset{margin-left:auto;align-self:center;margin-bottom:6px;padding:3px 10px;font-size:12px;
  font-weight:400;border-radius:4px;border:1px solid rgba(255,255,255,.3);opacity:.85}
nav .reset:hover{opacity:1}
nav .reset[hidden]{display:none}
#frames{flex:1 1 auto;position:relative;min-height:0}
#frames iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
#frames iframe[hidden]{display:none}
@media print{
  /* 印刷は各アプリの中の「印刷」ボタンから行ってください（アプリ内だけが印刷されます） */
  nav{display:none}
}
</style>
</head>
<body>
<nav role="tablist" aria-label="アプリ切り替え">
  <span class="brand" aria-hidden="true"><span class="brand-icon"><svg width="14" height="14" viewBox="0 0 14 14" fill="#fff"><rect x="0" y="0" width="6" height="6" rx="1.5"/><rect x="8" y="0" width="6" height="6" rx="1.5"/><rect x="0" y="8" width="6" height="6" rx="1.5"/><rect x="8" y="8" width="6" height="6" rx="1.5" opacity=".55"/></svg></span>業務アプリ</span>
</nav>
<div id="frames"></div>
<script>
(function(){
  'use strict';
  // タブの一覧。アプリを追加・変更するときはここを編集します
  var APPS = [
    { id:'stock',      label:'薬剤在庫管理',         src:'apps/stock/index.html' },
    { id:'order',      label:'在宅移行初期管理料 指示書', src:'apps/order/index.html' },
    { id:'visit-list', label:'訪問リスト印刷',        src:'apps/visit-list/index.html' },
    { id:'vaccine',    label:'ワクチン接種管理',      src:'apps/vaccine/index.html' },
    { id:'jisan',      label:'持参薬管理',           src:'apps/jisan/index.html' }
  ];
  var LAST_KEY = 'businessApp.portal.lastTab';
  var ORDER_KEY = 'businessApp.portal.tabOrder';
  var DEFAULT_ORDER = APPS.map(function(a){ return a.id; });
  // 保存してある並び順を反映（新しく増えたタブは最後に付ける）
  (function(){
    var saved;
    try { saved = JSON.parse(localStorage.getItem(ORDER_KEY) || 'null'); } catch(e) {}
    if (!Array.isArray(saved)) return;
    APPS.sort(function(a, b){
      var i = saved.indexOf(a.id), j = saved.indexOf(b.id);
      return (i < 0 ? 1e9 + DEFAULT_ORDER.indexOf(a.id) : i) - (j < 0 ? 1e9 + DEFAULT_ORDER.indexOf(b.id) : j);
    });
  })();
  var nav = document.querySelector('nav');
  var box = document.getElementById('frames');
  var tabs = {}, frames = {};

  APPS.forEach(function(app){
    var b = document.createElement('button');
    b.type = 'button';
    b.id = 'tab-' + app.id;
    b.className = 'tab';
    b.title = 'ドラッグで並べ替えできます';
    b.setAttribute('role','tab');
    b.setAttribute('aria-selected','false');
    b.setAttribute('aria-controls','frame-' + app.id);
    b.textContent = app.label;
    b.addEventListener('click', function(){ show(app.id); });
    nav.appendChild(b);
    tabs[app.id] = b;
  });

  var resetBtn = document.createElement('button');
  resetBtn.type = 'button';
  resetBtn.className = 'reset';
  resetBtn.textContent = '並び順を元に戻す';
  resetBtn.addEventListener('click', function(){
    APPS.sort(function(a, b){ return DEFAULT_ORDER.indexOf(a.id) - DEFAULT_ORDER.indexOf(b.id); });
    APPS.forEach(function(a){ nav.insertBefore(tabs[a.id], resetBtn); });
    try { localStorage.removeItem(ORDER_KEY); } catch(e) {}
    updateReset();
  });
  nav.appendChild(resetBtn);

  function tabEls(){ return Array.prototype.slice.call(nav.querySelectorAll('button.tab')); }
  function updateReset(){
    resetBtn.hidden = APPS.every(function(a, i){ return a.id === DEFAULT_ORDER[i]; });
  }
  // 画面上の並び（DOM の順）を APPS と保存データに反映する
  function saveOrder(){
    var ids = tabEls().map(function(b){ return b.id.slice(4); });
    APPS.sort(function(a, b){ return ids.indexOf(a.id) - ids.indexOf(b.id); });
    try { localStorage.setItem(ORDER_KEY, JSON.stringify(ids)); } catch(e) {}
    updateReset();
  }
  updateReset();

  // キーボード: ← → でタブ移動、Ctrl + Shift + ← → で選んでいるタブを左右に移動
  nav.addEventListener('keydown', function(e){
    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
    var i = APPS.findIndex(function(a){ return tabs[a.id] === document.activeElement; });
    if (i < 0) return;
    var left = e.key === 'ArrowLeft';
    e.preventDefault();
    if (e.ctrlKey && e.shiftKey) {
      var el = tabs[APPS[i].id], els = tabEls(), k = els.indexOf(el);
      if (left && k > 0) nav.insertBefore(el, els[k - 1]);
      else if (!left && k < els.length - 1) nav.insertBefore(el, els[k + 1].nextSibling);
      else return;
      saveOrder(); el.focus();
      return;
    }
    var n = APPS[(i + (left ? APPS.length - 1 : 1)) % APPS.length];
    show(n.id); tabs[n.id].focus();
  });

  // ---- ドラッグ（マウスはそのまま、タッチは長押ししてから）でタブを並べ替える ----
  var drag = null, suppressClick = false;
  function startDrag(){
    drag.active = true;
    drag.el.classList.add('dragging');
    nav.classList.add('reordering');
    try { drag.el.setPointerCapture(drag.pointerId); } catch(e) {}
  }
  function slide(el, fromLeft){
    // 入れ替わったタブを、元の位置からなめらかに移動させる
    var dx = fromLeft - el.getBoundingClientRect().left;
    if (!dx) return;
    el.style.transition = 'none';
    el.style.transform = 'translateX(' + dx + 'px)';
    el.getBoundingClientRect();
    el.style.transition = '';
    el.style.transform = '';
  }
  function moveDrag(x){
    var el = drag.el, navLeft = nav.getBoundingClientRect().left - nav.scrollLeft;
    var left = x - drag.grab, mid = left + el.offsetWidth / 2;
    var prev = el.previousElementSibling, next = el.nextElementSibling, from;
    if (prev && prev.classList.contains('tab') && mid < navLeft + prev.offsetLeft + prev.offsetWidth / 2) {
      from = prev.getBoundingClientRect().left; nav.insertBefore(el, prev); slide(prev, from);
    } else if (next && next.classList.contains('tab') && mid > navLeft + next.offsetLeft + next.offsetWidth / 2) {
      from = next.getBoundingClientRect().left; nav.insertBefore(next, el); slide(next, from);
    }
    el.style.transform = 'translateX(' + (left - (navLeft + el.offsetLeft)) + 'px)';
  }
  function endDrag(save){
    if (!drag) return;
    var d = drag; drag = null;
    clearTimeout(d.timer);
    if (!d.active) return;
    d.el.classList.remove('dragging');
    nav.classList.remove('reordering');
    d.el.style.transform = '';
    suppressClick = true;
    setTimeout(function(){ suppressClick = false; }, 0);
    if (save) saveOrder();
  }
  nav.addEventListener('pointerdown', function(e){
    var el = e.target.closest && e.target.closest('button.tab');
    if (!el || e.button !== 0 || drag) return;
    drag = { el: el, pointerId: e.pointerId, x0: e.clientX, y0: e.clientY, active: false,
             touch: e.pointerType !== 'mouse',
             grab: e.clientX - el.getBoundingClientRect().left };
    // タッチは横スクロールと区別するため、0.35秒長押ししてから並べ替え
    if (drag.touch) drag.timer = setTimeout(function(){ if (drag && !drag.active) startDrag(); }, 350);
  });
  nav.addEventListener('pointermove', function(e){
    if (!drag || e.pointerId !== drag.pointerId) return;
    if (!drag.active) {
      var far = Math.abs(e.clientX - drag.x0) > 6 || Math.abs(e.clientY - drag.y0) > 6;
      if (!far) return;
      if (drag.touch) { endDrag(false); return; } // 長押し前に動いた＝スクロール
      startDrag();
    }
    moveDrag(e.clientX);
  });
  nav.addEventListener('pointerup', function(e){ if (drag && e.pointerId === drag.pointerId) endDrag(true); });
  nav.addEventListener('pointercancel', function(e){ if (drag && e.pointerId === drag.pointerId) endDrag(true); });
  // 並べ替え中はタッチでの画面スクロールを止める
  nav.addEventListener('touchmove', function(e){ if (drag && drag.active) e.preventDefault(); }, { passive: false });
  nav.addEventListener('contextmenu', function(e){ if (drag) e.preventDefault(); });
  // ドラッグを離したときにタブが切り替わらないようにする
  nav.addEventListener('click', function(e){ if (suppressClick) { e.stopPropagation(); e.preventDefault(); } }, true);

  function show(id){
    var app = APPS.find(function(a){ return a.id === id; }) || APPS[0];
    // 初めて開いたときだけ読み込み、以後は入力中の内容を保ったまま切り替える
    if (!frames[app.id]) {
      var f = document.createElement('iframe');
      f.id = 'frame-' + app.id;
      f.title = app.label;
      f.setAttribute('role','tabpanel');
      f.setAttribute('aria-labelledby','tab-' + app.id);
      f.src = app.src;
      box.appendChild(f);
      frames[app.id] = f;
    }
    APPS.forEach(function(a){
      var on = a.id === app.id;
      tabs[a.id].setAttribute('aria-selected', on ? 'true' : 'false');
      tabs[a.id].tabIndex = on ? 0 : -1;
      if (frames[a.id]) frames[a.id].hidden = !on;
    });
    document.title = app.label + ' - 業務アプリ';
    try { localStorage.setItem(LAST_KEY, app.id); } catch(e) {}
    if (location.hash !== '#' + app.id) history.replaceState(null, '', '#' + app.id);
    try { frames[app.id].contentWindow.focus(); } catch(e) {}
  }

  // ---- タブの中のアプリに代わってフォルダを操作する（apps/vaccine/portal-fs-bridge.js から呼ばれる） ----
  // パソコン内のファイルとして開くと、Chrome / Edge はタブの中からのフォルダ選択を禁止しているため。
  function idb(cfg, mode, fn){
    return new Promise(function(res, rej){
      var r = indexedDB.open(cfg.db, 1);
      r.onupgradeneeded = function(){ r.result.createObjectStore(cfg.store); };
      r.onerror = function(){ rej(r.error); };
      r.onsuccess = function(){
        var db = r.result, t = db.transaction(cfg.store, mode), q = fn(t.objectStore(cfg.store));
        t.oncomplete = function(){ db.close(); res(q && q.result); };
        t.onerror = function(){ db.close(); rej(t.error); };
      };
    });
  }
  async function savedDir(cfg){
    var h = await idb(cfg, 'readonly', function(s){ return s.get(cfg.key); });
    if (!h || h.kind !== 'directory') { var e = new Error('保存先フォルダが設定されていません'); e.name = 'NotFoundError'; throw e; }
    return h;
  }
  var FS_OPS = {
    hello: function(){ return true; },
    status: async function(a, cfg){ try { return { name: (await savedDir(cfg)).name }; } catch(e){ return null; } },
    pick: async function(a, cfg){
      var h = await window.showDirectoryPicker({ id: cfg.pickerId, mode: 'readwrite' });
      await idb(cfg, 'readwrite', function(s){ return s.put(h, cfg.key); });
      return { name: h.name };
    },
    perm: async function(a, cfg){
      var h = await savedDir(cfg), o = { mode: 'readwrite' };
      var st = await h.queryPermission(o);
      if (st !== 'granted' && a.request) st = await h.requestPermission(o);
      return st;
    },
    write: async function(a, cfg){
      var fh = await (await savedDir(cfg)).getFileHandle(String(a.name), { create: true });
      var w = await fh.createWritable(); await w.write(a.data); await w.close();
      return true;
    },
    list: async function(a, cfg){
      var out = [];
      for await (var ent of (await savedDir(cfg)).entries()) {
        var x = { name: ent[0], kind: ent[1].kind };
        if (x.kind === 'file') { var f = await ent[1].getFile(); x.lastModified = f.lastModified; x.size = f.size; }
        out.push(x);
      }
      return out;
    },
    read: async function(a, cfg){
      return (await (await (await savedDir(cfg)).getFileHandle(String(a.name))).getFile()).text();
    }
  };
  window.addEventListener('message', async function(e){
    var d = e.data;
    if (!d || d.portalFs !== 1 || !FS_OPS.hasOwnProperty(d.op) || !d.cfg) return;
    // 自分のタブの中のアプリからの依頼だけ受け付ける
    if (!Object.keys(frames).some(function(k){ return frames[k].contentWindow === e.source; })) return;
    var msg;
    try { msg = { portalFs: 1, id: d.id, ok: true, v: await FS_OPS[d.op](d.args || {}, d.cfg) }; }
    catch(err){ msg = { portalFs: 1, id: d.id, ok: false, v: { name: err && err.name, message: err && err.message } }; }
    e.source.postMessage(msg, '*');
  });

  window.addEventListener('hashchange', function(){ show(location.hash.slice(1)); });

  var first = location.hash.slice(1);
  if (!first) { try { first = localStorage.getItem(LAST_KEY); } catch(e) {} }
  show(first);
})();
</script>
</body>
</html>
