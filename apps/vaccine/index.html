<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<!-- 外部への通信を禁止（ブラウザが通信を止めます） -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'none'; form-action 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ワクチン接種管理</title>
<style>
:root{
  --bg:#f3f5f7;--panel:#fff;--ink:#1d2731;--muted:#66727f;--line:#d8dde3;--line2:#eceff2;
  --accent:#1f6fb5;--accent-weak:#e7f0f9;--accent-ink:#fff;
  --auto:#c0392b;--auto-weak:#fdeeec;
  --ok:#1b8553;--ok-weak:#e2f3ea;--warn:#8a5d00;--warn-weak:#fff3d4;--danger:#b42318;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Yu Gothic UI","Yu Gothic","Meiryo","Hiragino Sans",sans-serif;font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 12px;white-space:nowrap}
button:hover{border-color:#b7c0ca;background:#f8fafb}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
button.primary:hover{filter:brightness(1.07)}
button.danger{color:var(--danger);border-color:#f0c4c0}
button.small{padding:2px 8px;font-size:13px}
button:disabled{opacity:.45;cursor:default}
input[type=text],input[type=search],input[type=date],select,textarea{border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:#fff;min-width:0}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

header.top{background:var(--panel);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{font-size:19px;margin:0;letter-spacing:.04em}
.badge{font-size:12px;padding:1px 8px;border-radius:999px;background:var(--accent-weak);color:var(--accent);font-weight:600}
.status{font-size:13px;color:var(--muted)}
.status b{color:var(--ink)}
.status .warnTxt{color:var(--warn);font-weight:600}
.actions{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto}
.sep{width:1px;background:var(--line);margin:0 4px}

nav.tabs{display:flex;gap:2px;padding:0 16px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto}
nav.tabs button{border:0;border-bottom:3px solid transparent;border-radius:0;background:none;padding:10px 16px;font-weight:600;color:var(--muted)}
nav.tabs button.active{color:var(--accent);border-bottom-color:var(--accent)}
nav.tabs .cnt{font-size:12px;font-weight:500;margin-left:6px;background:var(--line2);color:var(--muted);border-radius:999px;padding:0 7px}
nav.tabs button.active .cnt{background:var(--accent-weak);color:var(--accent)}

main{padding:12px 16px 40px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.toolbar input[type=search]{width:240px}
.summary{margin-left:auto;font-size:13px;color:var(--muted)}
.summary b{color:var(--ink);font-size:15px}
.tablewrap{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:auto;max-height:calc(100vh - 210px)}
table.list{border-collapse:collapse;width:100%;font-size:14px}
table.list th{position:sticky;top:0;background:#f7f8fa;border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;font-size:12.5px;color:var(--muted);font-weight:600;white-space:nowrap;z-index:1}
table.list td{border-bottom:1px solid var(--line2);padding:6px 8px;vertical-align:middle;white-space:nowrap}
table.list tbody tr{cursor:pointer}
table.list tbody tr:hover td{background:#f5f9fd}
table.list td.num{text-align:right;font-variant-numeric:tabular-nums}
.kana{display:block;font-size:11.5px;color:var(--muted);line-height:1.2}
.nm{font-weight:600}
.tag{display:inline-block;font-size:12px;padding:0 6px;border-radius:4px;background:var(--line2);margin:1px 2px 1px 0;line-height:1.6}
.tag.auto{background:var(--auto-weak);color:var(--auto)}
.tag.ok{background:var(--ok-weak);color:var(--ok)}
.tag.warn{background:var(--warn-weak);color:var(--warn)}
.done{color:var(--ok);font-weight:600}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
.empty:empty{display:none}
.memo{max-width:220px;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}

dialog{border:0;border-radius:10px;padding:0;width:min(880px,96vw);max-height:94vh;box-shadow:0 20px 60px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(20,30,40,.45)}
.dlg{display:flex;flex-direction:column;max-height:94vh}
.dlg-h{display:flex;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line)}
.dlg-h h2{margin:0;font-size:17px}
.dlg-h .x{margin-left:auto;border:0;font-size:20px;line-height:1;padding:2px 8px;background:none}
.dlg-b{padding:14px 18px;overflow:auto}
.dlg-f{display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--line);background:#fafbfc;border-radius:0 0 10px 10px}
.dlg-f .grow{flex:1}
.sec{margin-bottom:16px}
.sec h3{font-size:13.5px;margin:0 0 8px;color:var(--muted);font-weight:600;letter-spacing:.05em}
.searchbox{display:flex;gap:8px}
.searchbox input{flex:1;font-size:16px;padding:8px 10px}
.results{border:1px solid var(--line);border-radius:6px;margin-top:6px;max-height:260px;overflow:auto}
.results:empty{display:none}
.res{display:grid;grid-template-columns:90px 1fr 150px 1fr;gap:8px;padding:7px 10px;border-bottom:1px solid var(--line2);cursor:pointer;align-items:center}
.res:last-child{border-bottom:0}
.res:hover,.res.hl{background:var(--accent-weak)}
.res .id{color:var(--muted);font-variant-numeric:tabular-nums}
.res .gh{color:var(--muted);font-size:13px}
.hint{font-size:12.5px;color:var(--muted)}
.patcard{border:1px solid var(--line);border-left:4px solid var(--auto);border-radius:6px;padding:10px 14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px 18px;position:relative}
.patcard .f small{display:block;font-size:11.5px;color:var(--muted)}
.patcard .f span{color:var(--auto);font-weight:600}
.patcard .f.wide{grid-column:1/-1}
.patcard .chg{position:absolute;right:10px;top:8px}
.autonote{font-size:11.5px;color:var(--auto);margin-top:4px}
.dates{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px 16px}
.df label{display:block;font-size:13px;color:var(--muted);margin-bottom:2px}
.df .row{display:flex;gap:4px}
.df input{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;align-items:center}
.chips .gl{font-size:12.5px;color:var(--muted);min-width:64px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer;user-select:none;background:#fff}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip:has(input:checked){background:var(--accent);border-color:var(--accent);color:#fff}
.chip:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:1px}
.chip.autochip{border-color:#efc2bd;background:var(--auto-weak);color:var(--auto);cursor:default}
.chip.autochip.no{background:#f4f5f6;color:var(--muted);border-color:var(--line)}
.chip .why{font-size:11px;opacity:.85}
.warns div{background:var(--warn-weak);color:var(--warn);border-radius:6px;padding:6px 10px;font-size:13.5px;margin-top:6px}
.manual{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px 18px;margin-top:8px;padding:18px;border:2px solid var(--accent);border-radius:8px;background:var(--accent-weak)}
.manual .mt{grid-column:1/-1;font-size:16px;font-weight:700;color:var(--accent)}
.manual label{display:block;font-size:14px;font-weight:600;margin-bottom:4px}
.manual label .req{color:var(--danger);font-size:12px;margin-left:4px}
.manual input{width:100%;font-size:17px;padding:10px 12px}
.manual button{font-size:16px;padding:10px 20px}
.manualbtn{margin-top:8px;font-size:15px;padding:9px 16px;border-color:var(--accent);color:var(--accent);font-weight:600;background:#fff}
.warns .err{background:#fde8e6;color:var(--danger);font-weight:700;border:1px solid #f0b4ae}
#printArea{display:none}
.pl h2{font-size:17px;margin:0 0 2px}
.pl .sub{color:var(--muted);font-size:13px;margin-bottom:8px}
.pl h3.vt{font-size:15px;margin:14px 0 4px;padding:3px 8px;background:#e9eef3;color:#1d2731;letter-spacing:.04em}
.pl h4.gt{font-size:14px;margin:10px 0 2px;padding:2px 6px;border-left:4px solid var(--accent)}
.pl table{border-collapse:collapse;width:100%;font-size:13px;margin-bottom:4px}
.pl th,.pl td{border:1px solid #888;padding:3px 6px;text-align:left;vertical-align:middle}
.pl th{background:#f0f2f4;font-weight:600;font-size:12px}
.pl td.c{text-align:center}
.pl td:nth-child(3){white-space:nowrap}
.pl tr.grp td{background:#e9eef3;font-weight:700;font-size:12.5px;padding:2px 6px}
.pl tr.grp{break-after:avoid}
.pl .kn{display:block;font-size:10.5px;color:#555;line-height:1.15}
.pl .chkbox{display:inline-block;width:15px;height:15px;border:1.5px solid #222;vertical-align:middle}
@media print{.pl.calprint.pb{break-before:page}}
.pl.calprint table{table-layout:fixed;font-size:15px}
.pl.calprint td.cl,.pl.calprint td.ce{height:84px;vertical-align:top;padding:4px 6px}
.pl.calprint .cdn{display:block;font-weight:700;font-size:16px}
.pl.calprint .cnn{display:block;text-align:center;font-size:28px;font-weight:700;margin-top:8px}
.pl.calprint .cnn.mu{font-size:16px;line-height:1.2;margin-top:2px;text-align:left}
.pl.calprint.calprint td.cl{height:100px}
.pl.calprint .calstamp{float:right;font-size:13px;color:#333}
.pl.calprint td.pst,.pl.calprint td.pst .cdn,.pl.calprint td.pst .cnn{color:#bbb!important}
.pl.calprint td.pst .cdn,.pl.calprint td.pst .cnn{opacity:.4;font-weight:400}
.pl.calprint td.pst{background:#f0f0f0}
.pl.calprint td.su .cdn{color:#b42318}.pl.calprint td.sa .cdn{color:#1f6fb5}
.pl .none{color:var(--muted);padding:20px 0}
.pl .total{margin-top:8px;font-size:13px;font-weight:600}
@media print{
  @page{size:A4 landscape;margin:10mm}
  body{background:#fff}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block!important}
  .pl .pb{break-before:page}
  .pl tr{break-inside:avoid}
  .pl h3.vt,.pl h4.gt{break-after:avoid}
}
table.list td.chk,table.list th:first-child{width:34px;text-align:center}
table.list input[type=checkbox]{width:17px;height:17px;cursor:pointer}
.patcard .chg2{right:104px}
.jdwrap{display:inline-flex;flex-direction:column;position:relative;vertical-align:top;min-width:0}
.df .row .jdwrap,.manual .jdwrap{flex:1;display:flex;width:100%}
.jdline{display:flex;gap:4px;align-items:center}
.df .row{align-items:flex-start}
.df .row>button{align-self:flex-start;height:34px;margin-top:0}
.jdline input.jd{flex:1;min-width:110px;width:100%}
.jdline .jdbtn{padding:0 8px;font-size:15px;height:34px}
.jdline input.jd{height:34px}
.jdhint{font-size:11.5px;color:var(--muted);min-height:1.2em;line-height:1.3;padding-left:2px}
.jdhint.err,input.jd.err{color:var(--danger)}
input.jd.err,input.jd.bad{border-color:var(--danger);background:#fdf1f0;outline:2px solid #f0b4ae}
.manual .jdline input.jd,.manual .jdline .jdbtn{height:auto}
.jdline .jdbtn{white-space:nowrap}
.jdpop{position:fixed;z-index:1000;width:300px;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.25);padding:10px 12px;font-size:14px}
.jdpop .jdpt{font-weight:700;color:var(--accent);margin-bottom:6px}
.jdpop .jdrow{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.jdpop select{padding:5px 4px}
.jdpop .jdmsg{color:var(--danger);font-size:12.5px;min-height:1.3em;margin-top:4px}
.jdpop .jdact{display:flex;justify-content:flex-end;gap:6px;margin-top:4px}
.jdpop.calpop{width:320px}
.calhd{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.calgrid i{font-style:normal;font-size:12px;color:var(--muted);padding:2px 0}
.calgrid i:first-child{color:var(--danger)}
.jdpop.calpop.multi{width:380px}
.calgrid .cd small{word-break:keep-all}
.calpop.multi .calgrid .cd small{font-size:10px;font-weight:600;text-align:center;line-height:1.15}
.calgrid .cd{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:42px;padding:0;border-radius:6px;border:1px solid transparent;background:#fff;line-height:1.1}
.calgrid .cd small{font-size:11px;min-height:12px;color:var(--accent);font-weight:700}
.calgrid .cd.has{background:var(--accent-weak)}
.calgrid .cd.past{opacity:.4}
.calgrid .cd.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.calgrid .cd.sel{background:var(--accent);color:#fff}
.calgrid .cd.sel small{color:#fff}
.jdnative{position:absolute!important;left:0;bottom:0;width:1px!important;height:1px!important;opacity:0;pointer-events:none;border:0;padding:0}
tr.overdue td{background:#fff0ee}
tr.overdue:hover td{background:#ffe5e1!important}
tr.overdue td:first-child{box-shadow:inset 4px 0 0 var(--danger)}
.tag.over{background:var(--danger);color:#fff;font-weight:700}
tr.canceled td{color:var(--muted);background:#f6f6f6}
tr.canceled .nm{text-decoration:line-through}
input.bad{border-color:var(--danger);background:#fdf1f0;outline:2px solid #f0b4ae}
.linkbtn{border:0;background:none;color:var(--accent);padding:0;text-decoration:underline;font-size:13px}
.maptbl{border-collapse:collapse;font-size:13px;width:100%}
.maptbl th,.maptbl td{border:1px solid var(--line2);padding:4px 6px;text-align:left;white-space:nowrap}
.maptbl th{background:#f7f8fa}
.mapgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px 14px;margin-bottom:12px}
.mapgrid label{display:block;font-size:12.5px;color:var(--muted)}
.mapgrid select{width:100%}
.bulklist{border:1px solid var(--line);border-radius:6px;max-height:300px;overflow:auto}
.bulklist label{display:grid;grid-template-columns:24px 80px 1fr 110px 60px;gap:8px;padding:6px 10px;border-bottom:1px solid var(--line2);align-items:center}
.bulklist label.dis{color:var(--muted)}
.form2{display:grid;grid-template-columns:150px 1fr;gap:10px 12px;align-items:center}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#22303c;color:#fff;padding:10px 16px;border-radius:8px;display:none;gap:12px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:100;font-size:14px}
#toast button{background:none;border:1px solid #6b7b89;color:#fff;padding:2px 10px}
@media (max-width:640px){
  .toolbar input[type=search]{width:100%}
  .summary{margin-left:0}
  .res{grid-template-columns:1fr 1fr}
  .form2{grid-template-columns:1fr}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><h1>ワクチン接種管理</h1><span class="badge" id="fyBadge"></span><span class="status" title="画面が最新かどうかの確認用です">版 2026-10-22 R</span></div>
  <div class="status" id="status"></div>
  <div class="actions">
    <button id="btnMaster" title="患者マスタのExcel（.xlsx / .xlsm / .csv）を読み込みます">患者マスタ読込</button>
    <button id="btnMasterView" title="アプリ内の患者マスタを見て、編集・削除します">患者マスタを見る</button>
    <button id="btnFamily" title="患者家族マスタ（患者マスタとは別）を見て、追加・編集・削除・読み込みをします">患者家族マスタ</button>
    <button id="btnImport" title="今までのワクチン管理票（.xlsm）や、このアプリで出力したExcelを取り込みます">管理票取込</button>
    <button id="btnExport" title="管理票の形式でExcelファイルを出力します">Excel出力</button>
    <span class="sep"></span>
    <button id="btnBackup">バックアップ保存</button>
    <button id="btnRestore">バックアップ復元</button>
    <button id="btnSettings">設定</button>
    <button id="btnExit" title="バックアップを保存して終了します（ブラウザ内データの削除は任意）">バックアップして終了</button>
  </div>
</header>
<nav class="tabs" id="tabs"></nav>
<main>
  <div class="toolbar">
    <button class="primary" id="btnNew">＋ 新規登録</button>
    <button class="primary" id="btnDayDone" title="接種予定日の方を一覧で選び、接種完了にします">接種完了の入力</button>
    <button id="btnSendList" title="予診票の発送日ごとに、仙台市／仙台市以外に分けて一覧を表示・印刷します">予診票発送一覧・印刷</button>
    <button id="btnPlanList" title="接種予定日ごとの接種者一覧を表示・印刷します">接種予定者一覧・印刷</button>
    <button id="btnDateSel" disabled title="チェックした方の予診票発送日・接種予定日をまとめて設定します">選択した方の日付を設定</button>
    <button class="danger" id="btnDelSel" disabled>選択を削除</button>
    <input type="search" id="q" placeholder="氏名・ふりがな・IDで絞り込み">
    <select id="fStatus">
      <option value="">すべて</option>
      <option value="todo">未接種（キャンセル除く）</option>
      <option value="done">接種済</option>
      <option value="today">本日接種予定</option>
      <option value="cancel">キャンセル</option>
      <option value="overdue">予定日を過ぎた未接種</option>
      <option value="noplan">接種予定日が未定（未入力）</option>
    </select>
    <select id="fGh"></select>
    <select id="fSort">
      <option value="no">受付順</option>
      <option value="new">新しい順</option>
      <option value="kana">ふりがな順</option>
      <option value="plan">接種予定日順</option>
      <option value="overdue">予定日を過ぎた未接種を先に</option>
      <option value="noplan">接種予定日が未定を先に</option>
    </select>
    <div class="summary" id="summary"></div>
  </div>
  <div class="tablewrap">
    <table class="list"><thead id="thead"></thead><tbody id="tbody"></tbody></table>
    <div class="empty" id="empty"></div>
  </div>
</main>

<div id="printArea"></div>
<dialog id="dlg"><div class="dlg"><div class="dlg-h"><h2 id="dlgTitle"></h2><button class="x" id="dlgX" aria-label="閉じる">×</button></div><div class="dlg-b" id="dlgBody"></div><div class="dlg-f" id="dlgFoot"></div></div></dialog>
<input type="file" id="fileMaster" accept=".xlsx,.xlsm,.csv" hidden>
<input type="file" id="fileFamily" accept=".xlsx,.xlsm,.csv" hidden>
<input type="file" id="fileImport" accept=".xlsx,.xlsm" hidden>
<input type="file" id="fileRestore" accept=".json" hidden>
<div id="toast"><span id="toastMsg"></span><button id="toastBtn"></button></div>

<script>
'use strict';
/* ================= 定義 ================= */
const KEY = 'vaccineKanri.v1';
const MARK = '◯';
const C = (h, src, w) => ({h, src, w});
const DATE_FIELDS = [['recv','受付日'],['send','予診票発送日'],['plan','接種予定日'],['done','接種日']];
const COMMON_TAIL = [C('備考','memo',16), C('ふりがな','#kana',16), C('生年月日','#birth',12), C('住所','#addr',30)];

const VACCINES = [
  { id:'flu', label:'インフルエンザ', sheet:'インフルワクチン', match:'インフル',
    radios:[],
    auto:{label:'65歳以上', test:a=>a!=null&&a>=65},
    needOneOf:['shin','ippan'],
    flags:[
      {g:'対象区分', items:[['shin','60～64歳 身障1級'],['ippan','一般（助成対象外）'],['outside','仙台市以外']]},

function ageAt(birth, base){
  if(!birth || !base) return null;
  const [y,m,d] = birth.split('-').map(Number), [Y,M,D] = base.split('-').map(Number);
  let a = Y - y; if(M<m || (M===m && D<d)) a--;

}

function serialToStr(n){
  const d = new Date(Math.round((Math.floor(n) - 25569) * 86400000));
  return `${d.getUTCFullYear()}-${p2(d.getUTCMonth()+1)}-${p2(d.getUTCDate())}`;
}
function strToSerial(s){ const [y,m,d]=s.split('-').map(Number); return Date.UTC(y,m-1,d)/86400000 + 25569; }
function validYMD(y,m,d){
  const dt = new Date(Date.UTC(y,m-1,d));
  return y>1850 && y<2200 && dt.getUTCMonth()===m-1 && dt.getUTCDate()===d ? `${y}-${p2(m)}-${p2(d)}` : '';

const ERA = {'明治':1867,'大正':1911,'昭和':1925,'平成':1988,'令和':2018,m:1867,t:1911,s:1925,h:1988,r:2018};
function parseDate(v){
  if(v == null || v === '') return '';
  if(typeof v === 'number') return v > 60 && v < 80000 ? serialToStr(v) : '';
  const s = String(v).normalize('NFKC').trim();
  if(!s || s.startsWith('※')) return '';
  let m;
  if((m = s.match(/^(\d{4})(\d{2})(\d{2})$/))) return validYMD(+m[1],+m[2],+m[3]);
  if(/^\d+(\.\d+)?$/.test(s)) return parseDate(Number(s));
  if((m = s.match(/^(\d{4})[\/\-.年](\d{1,2})[\/\-.月](\d{1,2})/))) return validYMD(+m[1],+m[2],+m[3]);
  const eraDate = (k, y, mo, d) => {   // 和暦 → 西暦（その元号に存在しない年は読み取れない扱い）
    const name = ERA_NAME[k.toLowerCase()] || k, ymd = validYMD(ERA[name] + y, mo, d);
    return ymd && toWareki(ymd).era === name ? ymd : '';
  };
  if((m = s.match(/^(明治|大正|昭和|平成|令和|[MTSHRmtshr])\s*(\d{1,2}|元)\s*[\/\-.年]\s*(\d{1,2})\s*[\/\-.月]\s*(\d{1,2})/))) return eraDate(m[1], m[2]==='元'?1:+m[2], +m[3], +m[4]);
  if((m = s.match(/^([MTSHRmtshr])(\d{2})(\d{2})(\d{2})$/))) return eraDate(m[1], +m[2], +m[3], +m[4]);   // 例 S310303
  return '';
}
const ERA_NAME = {m:'明治', t:'大正', s:'昭和', h:'平成', r:'令和'};
// 西暦（YYYY-MM-DD）→ 和暦
function toWareki(ymd){
  if(!ymd) return {era:'', year:0, text:''};
  const [y,m,d] = ymd.split('-').map(Number), n = y*10000 + m*100 + d;
  const e = n >= 20190501 ? ['令和',2018] : n >= 19890108 ? ['平成',1988] : n >= 19261225 ? ['昭和',1925] : n >= 19120730 ? ['大正',1911] : n >= 18680125 ? ['明治',1867] : null;
  if(!e) return {era:'', year:y, text:`${y}年${m}月${d}日`};
  const yr = y - e[1];
  return {era:e[0], year:yr, text:`${e[0]}${yr===1?'元':yr}年${m}月${d}日`};
}

function migrateExtras(){
  if(!state.family) state.family = {list:[], fileName:'', loadedAt:'', edited:false};
  if(state.extras && state.extras.length){
    state.extras.forEach(x=>{ if(!state.family.list.some(f=>f.id===x.id)){ const {manual, imported, ...rec} = x; state.family.list.push(rec); } });
  }
  state.extras = [];
}

function jdate(el){
  if(el._jd) return; el._jd = true;
  const wrap = document.createElement('span'); wrap.className = 'jdwrap';
  const line = document.createElement('span'); line.className = 'jdline';
  const tx = document.createElement('input'); tx.type = 'text'; tx.className = 'jd'; tx.autocomplete = 'off'; tx.placeholder = '西暦・和暦で入力'; tx.title = '例：1956/3/3　S31.3.3　昭和31年3月3日　令和8年10月25日';
  tx.setAttribute('aria-label', '日付（西暦・和暦どちらでも入力できます）');
  const btn = document.createElement('button'); btn.type = 'button'; btn.className = 'small jdbtn'; btn.textContent = '📅'; btn.title = 'カレンダーから選ぶ';
  const wbtn = document.createElement('button'); wbtn.type = 'button'; wbtn.className = 'small jdbtn'; wbtn.textContent = '和暦'; wbtn.title = '元号・年・月・日を選んで入力する';
  const hint = document.createElement('span'); hint.className = 'jdhint';
  el.parentNode.insertBefore(wrap, el); line.append(tx, btn, wbtn); wrap.append(line, hint, el); el.classList.add('jdnative'); el.tabIndex = -1;
  const sync = () => {
    const v = dvDesc.get.call(el);
    tx.value = v ? v.replace(/-/g,'/') : ''; tx.classList.remove('err');
    hint.textContent = v ? toWareki(v).text : ''; hint.classList.remove('err');
  };
  Object.defineProperty(el, 'value', {configurable:true, get(){ return dvDesc.get.call(el); }, set(v){ dvDesc.set.call(el, v); sync(); }});
  const commit = () => {
    const t = tx.value.trim();
    if(!t){ if(el.value){ dvDesc.set.call(el, ''); el.dispatchEvent(new Event('change', {bubbles:true})); } sync(); return; }
    const d = parseDate(t);
    if(!d){ tx.classList.add('err'); hint.textContent = '読み取れません（例：1956/3/3　S31.3.3　昭和31年3月3日）'; hint.classList.add('err'); return; }
    const changed = d !== el.value; dvDesc.set.call(el, d); sync();
    if(changed) el.dispatchEvent(new Event('change', {bubbles:true}));
  };
  tx.addEventListener('change', commit);
  tx.addEventListener('keydown', ev => { if(ev.key === 'Enter'){ ev.preventDefault(); commit(); } });
  el.addEventListener('change', sync);
  btn.addEventListener('click', () => { try{ el.showPicker(); }catch(e){ el.focus(); } });
  wbtn.addEventListener('click', ev => { ev.stopPropagation(); openEraPicker(el, wbtn, () => { sync(); el.dispatchEvent(new Event('change', {bubbles:true})); }); });

}
/* 予定のある日と人数を表示するカレンダー（counts: Map(日付 → 人数)）。過去の日付は薄く表示する */
// カレンダーの人数（counts の値は {ワクチンID: 人数}）。種類別の略称：イ=インフルエンザ コ=コロナ 帯=帯状疱疹 肺=肺炎球菌
const VSHORT = {flu:'イ', covid:'コ', zoster:'帯', pneumo:'肺'}, VSHORT_NOTE = 'イ=インフルエンザ　コ=コロナ　帯=帯状疱疹　肺=肺炎球菌';

const cntTotal = o => o ? Object.values(o).reduce((a,b)=>a+b, 0) : 0;

// 印刷用のカレンダー（日付と人数のみ。multi のときは種類別）
function calPrintHtml(y, m, counts, title, sub, pb, multi){
  const first = new Date(y, m-1, 1).getDay(), dim = new Date(y, m, 0).getDate(), cells = [];
  for(let i = 0; i < first; i++) cells.push('<td class="ce"></td>');
  for(let d = 1; d <= dim; d++){
    const o = counts.get(`${y}-${p2(m)}-${p2(d)}`), n = cntTotal(o), wd = new Date(y, m-1, d).getDay();
    const txt = !n ? '' : multi ? cntParts(o).map(([v,c])=>`${VPRINT[v.id]} ${c}人`).join('<br>') : n + '人';
    const past = `${y}-${p2(m)}-${p2(d)}` < todayStr();
    cells.push(`<td class="cl${wd===0?' su':wd===6?' sa':''}${past?' pst':''}"><span class="cdn">${d}</span><span class="cnn${multi?' mu':''}">${txt}</span></td>`);
  }
  while(cells.length % 7) cells.push('<td class="ce"></td>');
  let rows = ''; for(let i = 0; i < cells.length; i += 7) rows += `<tr>${cells.slice(i, i+7).join('')}</tr>`;
  return `<div class="pl calprint${pb?' pb':''}"><div class="calstamp">出力日 ${fmtD(todayStr())}</div><h2>${esc(title)}　${y}年${m}月</h2><div class="sub">${esc(state.settings.fy)}　${esc(sub)}</div>

  inp.oninput = draw;

  if(ed.isNew) $('#btnBulkIn').onclick = () => { dlg.close(); openBulk(); };
  setTimeout(()=>inp.focus(), 30);
}
function applyAutoSuggest(v, e, p){
  const notes = {};
  if(v.flags.some(g=>g.items.some(([k])=>k==='outside'))){
    if(p.addr){
      if(p.addr.includes('仙台市')) delete e.sel.outside;
      else { e.sel.outside = true; notes.outside = '住所から自動判定'; }
    }
  }
  const age = ageAt(p.birth, baseDate());
  v.radios.forEach(g=>{ if(g.suggest && !g.items.some(([k])=>e.sel[k])){ const k = g.suggest(age); if(k){ e.sel[k]=true; notes[k]='年齢から推定'; } } });
  return notes;
}
function selectPatient(p){
  const {e, v} = ed;
  e.pid = p.id; e.snap = {id:p.id, name:p.name||'', kana:p.kana||'', birth:p.birth||'', addr:p.addr||'', gh:p.gh||''};
  if(p.rel){ e.snap.rel = p.rel; if(p.relTo) e.snap.relTo = p.relTo; if(p.relToName) e.snap.relToName = p.relToName; }
  if(ed.isNew) ed.autoNotes = applyAutoSuggest(v, e, p);
  renderPat(); renderSel(); renderWarns();
}
function renderSel(){
  const {v, e} = ed, p = e.pid ? patientOf(e) : null;
  const chip = (k, l, radio) => `<label class="chip"><input type="checkbox" data-k="${k}" ${radio?`data-g="${radio}"`:''} ${e.sel[k]?'checked':''}>${esc(l)}${ed.autoNotes[k]?`<span class="why">（${ed.autoNotes[k]}）</span>`:''}</label>`;
  let h = '';
  v.radios.forEach((g,gi)=>{ h += `<div class="chips"><span class="gl">${esc(g.g)}</span>${g.items.map(([k,l])=>chip(k,l,'r'+gi)).join('')}</div>`; });
  if(v.auto) h += `<div class="chips"><span class="gl">自動判定</span><span class="chip autochip" id="autoChip"></span></div>`;
  v.flags.forEach(g=>{ h += `<div class="chips"><span class="gl">${esc(g.g)}</span>${g.items.map(([k,l])=>chip(k,l)).join('')}</div>`; });
  $('#selArea').innerHTML = h;
  updAutoChip();
  $$('#selArea input[type=checkbox]').forEach(cb=>cb.onchange=()=>{
    const k = cb.dataset.k;
    if(cb.checked && cb.dataset.g){ $$(`#selArea input[data-g=${cb.dataset.g}]`).forEach(o=>{ if(o!==cb){ o.checked=false; delete e.sel[o.dataset.k]; } }); }
    if(cb.checked) e.sel[k]=true; else delete e.sel[k];
    delete ed.autoNotes[k];
    renderWarns();
  });
}
// 「65歳以上」などの自動判定の表示。接種日の年齢で判定する（日付の入力に合わせて更新）
function updAutoChip(){
  const el = $('#autoChip'); if(!el) return;
  const {v, e} = ed, p = e.pid ? patientOf(e) : null;
  if(!p){ el.className = 'chip autochip no'; el.textContent = `${v.auto.label}：患者選択後に判定`; return; }
  const va = vacAge(e, p, baseDate()), ok = v.auto.test(va.age);
  el.className = 'chip autochip' + (ok ? '' : ' no');
  el.innerHTML = `${ok?MARK+' ':''}${esc(v.auto.label)}${ok?'':'：該当なし'}<span class="why">（${BASIS_TXT[va.basis]} ${va.age ?? '－'}歳で判定）</span>`;
}
function entryWarnings(v, e, selfId){
  const w = [];
  // 「!」で始まるものは赤字のエラー表示
  if(e.send && e.plan && e.send > e.plan) w.push('!予診票発送日が接種予定日よりあとになっています。日付を確認してください。');
  if(e.done && e.send && e.done < e.send) w.push('!接種日が予診票発送日より前になっています。日付を確認してください。');
  if(!e.pid) return w;
  const p = patientOf(e), va = vacAge(e, p, baseDate()), age = va.age;
  if(!p.birth) w.push('生年月日が登録されていないため年齢を判定できません。');
  v.radios.forEach(g=>{ if(!g.items.some(([k])=>e.sel[k])) w.push(`「${g.g}」を選択してください。`); });
  if(v.needOneOf && v.auto && p.birth && !v.auto.test(age) && !v.needOneOf.some(k=>e.sel[k]))
    w.push(`${v.auto.short||v.auto.label}に該当しません（${BASIS_TXT[va.basis]} ${age}歳）。「${v.needOneOf.map(k=>LABEL[v.id+':'+k].replace(/（.*/,'')).join('」か「')}」を選択してください。`);
  const dup = state.entries[v.id].filter(x=>x.pid===e.pid && x.id!==selfId && !x.cancel);
  if(dup.length && !(v.id==='zoster' && e.sel.fukatsu)){
    const nos = computeNos(state.entries[v.id]);
    w.push(`この患者は既に登録されています（受付No ${dup.map(x=>nos.get(x.id)||'なし').join('、')}）。`);
  }
  if(e.done && e.plan && e.done < e.plan) w.push('接種日が接種予定日より前になっています。');
  return w;
}
// 患者カードの「接種日の年齢」を、日付の入力に合わせて更新する
function updAgeVac(){
  updAutoChip();
  const sp = $('#ageVac'); if(!sp) return;
  const {e} = ed, p = patientOf(e), d = e.done || e.plan, a = ageAt(p.birth, d);
  $('#ageVacL').textContent = e.done ? '接種日の年齢' : (e.plan ? '接種予定日の年齢' : '接種日の年齢');
  sp.textContent = a != null ? `${a}歳` : (d ? '' : '（日付未入力）');
}
function renderWarns(){
  updAgeVac();
  $('#warns').innerHTML = entryWarnings(ed.v, ed.e, ed.e.id).map(t=>t[0]==='!' ? `<div class="err">⚠ ${esc(t.slice(1))}</div>` : `<div>⚠ ${esc(t)}</div>`).join('');
  // 日付欄の赤枠
  const {e} = ed, bad = {send: e.send && e.plan && e.send > e.plan, plan: e.send && e.plan && e.send > e.plan};
  $$('#dlgBody input[type=date]').forEach(i=>i.classList.toggle('bad', !!bad[i.dataset.k]));
}
function saveEntry(next){
  const {e, isNew} = ed;
  if(!e.pid){ alert('患者を選択してください。'); return; }
  const m = masterMap.get(e.pid); if(m) e.snap = {...m};
  else if(familyMap.has(e.pid)) e.snap = {...familyMap.get(e.pid)};   // 患者家族マスタの患者は、家族マスタの内容を控えにする
  const list = state.entries[cur];
  if(isNew) list.push(e); else list[list.findIndex(x=>x.id===e.id)] = e;
  persist(); renderAll();
  const no = computeNos(list).get(e.id);
  toast(`${patientOf(e).name||e.pid} さんを${isNew?'登録':'更新'}しました${no?`（受付No ${no}）`:''}`);
  if(next) openEntry(null, e); else dlg.close();
}

/* ================= ZIP / XLSX 読み込み ================= */
async function unzip(buf){
  const dv = new DataView(buf), u8 = new Uint8Array(buf), td = new TextDecoder();
  let eocd = -1;
  for(let i = buf.byteLength - 22; i >= Math.max(0, buf.byteLength - 65557); i--){ if(dv.getUint32(i, true) === 0x06054b50){ eocd = i; break; } }
  if(eocd < 0) throw new Error('Excelファイル（.xlsx / .xlsm）ではありません。古い .xls 形式の場合は、Excelで「.xlsx」形式で保存し直してください。');
  const cnt = dv.getUint16(eocd + 10, true); let p = dv.getUint32(eocd + 16, true);
  const files = {};
  for(let k = 0; k < cnt; k++){
    if(dv.getUint32(p, true) !== 0x02014b50) break;
    const method = dv.getUint16(p+10,true), csize = dv.getUint32(p+20,true), nlen = dv.getUint16(p+28,true), elen = dv.getUint16(p+30,true), clen = dv.getUint16(p+32,true), off = dv.getUint32(p+42,true);
    const name = td.decode(u8.subarray(p+46, p+46+nlen));
    files[name.toLowerCase()] = {method, csize, off};
    p += 46 + nlen + elen + clen;
  }
  return {
    async text(name){
      const f = files[name.toLowerCase()]; if(!f) return null;
      const start = f.off + 30 + dv.getUint16(f.off+26,true) + dv.getUint16(f.off+28,true);
      const data = u8.subarray(start, start + f.csize);
      let out;
      if(f.method === 0) out = data;
      else if(f.method === 8){ out = new Uint8Array(await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer()); }
      else throw new Error('未対応の圧縮形式です');
      return td.decode(out);
    }
  };
}
const xml = t => new DOMParser().parseFromString(t, 'application/xml');
const tags = (el, n) => Array.from(el.getElementsByTagNameNS('*', n));
const textOf = el => tags(el, 't').filter(t=>t.parentNode.localName !== 'rPh').map(t=>t.textContent).join('');
function colIdx(ref){ let n = 0; for(const ch of ref){ const c = ch.charCodeAt(0); if(c < 65 || c > 90) break; n = n*26 + (c-64); } return n - 1; }
async function readXlsx(buf){
  const z = await unzip(buf);
  const sst = await z.text('xl/sharedStrings.xml');
  const ss = sst ? tags(xml(sst), 'si').map(textOf) : [];
  const wbT = await z.text('xl/workbook.xml'); if(!wbT) throw new Error('Excelファイルの構造を読み取れません');
  const relT = await z.text('xl/_rels/workbook.xml.rels');
  const rel = {}; if(relT) tags(xml(relT), 'Relationship').forEach(r=>rel[r.getAttribute('Id')] = r.getAttribute('Target'));
  const sheets = [];
  for(const s of tags(xml(wbT), 'sheet')){
    const rid = s.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id') || s.getAttribute('r:id');
    let tg = rel[rid]; if(!tg) continue;
    tg = tg.startsWith('/') ? tg.slice(1) : 'xl/' + tg.replace(/^\.\//,'');
    const x = await z.text(tg); if(!x) continue;
    const rows = [];
    for(const row of tags(xml(x), 'row')){
      const ri = (+row.getAttribute('r') || rows.length + 1) - 1, arr = [];
      let ci = 0;
      for(const c of row.children){
        if(c.localName !== 'c') continue;
        const r = c.getAttribute('r'); if(r) ci = colIdx(r);
        const t = c.getAttribute('t'), vEl = tags(c, 'v')[0], vt = vEl ? vEl.textContent : null;
        let val = null;
        if(t === 's') val = vt != null ? ss[+vt] : null;
        else if(t === 'inlineStr'){ const is = tags(c, 'is')[0]; val = is ? textOf(is) : ''; }
        else if(t === 'str' || t === 'e') val = vt ?? '';
        else if(t === 'b') val = vt === '1';
        else val = vt == null || vt === '' ? null : Number(vt);
        arr[ci] = val; ci++;
      }
      rows[ri] = arr;
    }
    for(let i = 0; i < rows.length; i++) if(!rows[i]) rows[i] = [];
    sheets.push({name: s.getAttribute('name'), rows});
  }
  return sheets;
}
function parseCSV(text){
  const rows = []; let row = [], f = '', q = false;
  for(let i = 0; i < text.length; i++){
    const ch = text[i];
    if(q){ if(ch === '"'){ if(text[i+1] === '"'){ f += '"'; i++; } else q = false; } else f += ch; }
    else if(ch === '"') q = true;
    else if(ch === ','){ row.push(f); f = ''; }
    else if(ch === '\n' || ch === '\r'){ if(ch === '\r' && text[i+1] === '\n') i++; row.push(f); rows.push(row); row = []; f = ''; }
    else f += ch;
  }
  if(f !== '' || row.length){ row.push(f); rows.push(row); }
  return rows;
}
async function readAnyTable(file){
  const buf = await file.arrayBuffer();
  if(/\.csv$/i.test(file.name)){
    let text;
    try{ text = new TextDecoder('utf-8', {fatal:true}).decode(buf); }catch(e){ text = new TextDecoder('shift_jis').decode(buf); }
    return [{name:'CSV', rows:parseCSV(text.replace(/^﻿/,''))}];
  }
  return readXlsx(buf);
}

/* ---------- 患者マスタ読込 ---------- */
const MFIELDS = [['id','ID（必須）'],['name','氏名'],['kana','ふりがな'],['birth','生年月日'],['jaddr','住民票住所（G列・あればこちらを優先）'],['addr','住所（住民票住所が空のとき使用）'],['gh','施設名（グループホーム）']];
const MALIAS = {
  id:['id','患者id','患者番号','カルテ番号','カルテno','診察券番号'],
  kana:['ふりがな','フリガナ','カナ氏名','カナ','よみがな','よみ','かな'],
  birth:['生年月日','誕生日'],
  gh:['グループホーム','施設名','施設','入所施設','gh'],
  addr:['住所','現住所'],
  jaddr:['住民票住所','住民票','住民票の住所','住民登録住所'],
  name:['氏名','患者氏名','患者名','名前','漢字氏名'],
};
const MDEF = {id:0, name:1, kana:2, birth:3, addr:4, gh:5};
function detectHeader(rows){
  let best = -1, bestScore = 0;
  for(let r = 0; r < Math.min(rows.length, 15); r++){
    const hs = (rows[r]||[]).map(normH);
    let sc = 0;
    for(const al of Object.values(MALIAS)) if(hs.some(h=>h && al.some(a=>h===normH(a)))) sc += 2; else if(hs.some(h=>h && al.some(a=>h.includes(normH(a))))) sc += 1;
    if(sc > bestScore){ bestScore = sc; best = r; }
  }
  return best;
}
function detectMap(rows, hr){
  const hs = hr >= 0 ? (rows[hr]||[]).map(normH) : [];
  const map = {}, used = new Set();
  for(const f of ['id','kana','birth','gh','jaddr','addr','name']){
    const al = MALIAS[f].map(normH);
    let i = hs.findIndex((h,j)=>h && !used.has(j) && al.includes(h));
    if(i < 0) i = hs.findIndex((h,j)=>h && !used.has(j) && al.some(a=>h.includes(a)));
    if(i >= 0){ map[f] = i; used.add(i); }
  }
  for(const f of Object.keys(MDEF)){ const i = MDEF[f]; if(map[f] == null && !used.has(i) && !hs[i]){ map[f] = i; used.add(i); } }
  // 住民票住所：見出し名で見つからなければG列（年齢・検索などの列でなければ）を既定にする
  if(map.jaddr == null && !used.has(6) && !/年齢|検索|age/i.test(hs[6]||'')){ map.jaddr = 6; used.add(6); }
  return map;
}
// 患者マスタから除外する患者（業務アプリまとめ版の運用ルール。訪問リスト印刷以外のアプリで使用）
// ・ID に「WA」を含む　・名前に「[亘]」を含む（全角の ＷＡ ／ ［亘］、【亘】、(亘) も対象）
function isExcludedPatient(id, name){
  const n = s => String(s == null ? '' : s).normalize('NFKC').toUpperCase();
  return n(id).includes('WA') || /[\[【(]\s*亘\s*[\]】)]/.test(n(name));
}
// 住所にこの名前が含まれていたら、グループホーム欄が空でもそのグループホームの患者として扱う。
// 増やすときは、この一覧に名前を追加する（空白・全角半角の違いは無視して探します）
const GH_NAMES_IN_ADDRESS = ['おひさまの家'];
const GH_MARKS = ['○', '◯', '〇', '●', '◎', '1', '有', 'あり', 'はい', '該当', '入居', 'gh', 'グループホーム', '✓', '✔', 'レ', 'y', 'yes'];
function ghFromAddress(...addrs){
  const n = s => String(s == null ? '' : s).normalize('NFKC').replace(/\s+/g, '');
  for(const a of addrs.map(n)) if(a){ const g = GH_NAMES_IN_ADDRESS.find(x => a.includes(n(x))); if(g) return g; }
  return '';
}
function buildPatients(rows, hr, map){
  const out = new Map(); let bad = 0, noBirth = 0, excluded = 0;
  for(let r = hr + 1; r < rows.length; r++){
    const row = rows[r] || [], g = f => map[f] == null || map[f] < 0 ? null : row[map[f]];
    const id = toIdStr(g('id'));
    if(!id){ continue; }
    const p = {id, name:strVal(g('name')), kana:strVal(g('kana')), birth:parseDate(g('birth')), addr:strVal(g('jaddr')) || strVal(g('addr')), gh:strVal(g('gh'))};
    // 施設名が空欄、または「○」などの印だけのときは、住所に含まれるグループホーム名を使う
    if(!p.gh || GH_MARKS.includes(p.gh.toLowerCase())) p.gh = ghFromAddress(g('addr'), g('jaddr')) || p.gh;
    if(!p.name && !p.kana){ bad++; continue; }
    if(isExcludedPatient(id, p.name)){ excluded++; continue; }
    if(!p.birth) noBirth++;
    out.set(id, p);
  }
  return {list:[...out.values()], bad, noBirth, excluded};
}

async function onImportFile(file){
  let sheets;
  try{ sheets = await readXlsx(await file.arrayBuffer()); }catch(e){ alert('読み込めませんでした：' + e.message); return; }
  const found = [];
  // IDのない行（ご家族など）は、氏名があれば患者家族マスタの患者として取り込む（IDは M0001 のように自動で付ける）。
  // 同じ氏名・生年月日は同じ患者にまとめ、すでに家族マスタにいる方はそのIDを使う
  const fam = new Map(), usedIds = new Set();
  state.family.list.forEach(p=>fam.set(`${normH(p.name)}|${p.birth||''}`, p));
  const newFamId = () => { const id = nextFamilyId(usedIds); usedIds.add(id); return id; };
  for(const v of VACCINES){
    const sh = sheets.find(s=>s.name.includes(v.match)); if(!sh) continue;
    const rows = sh.rows;
    let hr = rows.slice(0,5).findIndex(r=>(r||[]).some(c=>normH(c)==='id')); if(hr < 0) continue;
    const idx = {}; (rows[hr]||[]).forEach((h,i)=>{ const n = normH(h); const col = v.cols.find(c=>normH(c.h)===n); if(n && col && idx[col.src]==null) idx[col.src] = i; });
    if(idx.pid == null) continue;
    const entries = []; let t = Date.now(), noId = 0, skipped = 0;
    for(let r = hr+1; r < rows.length; r++){
      const row = rows[r] || [], g = s => idx[s]==null ? null : row[idx[s]];
      let pid = toIdStr(g('pid')), famP = null;
      if(!pid){
        const sv0 = s => { const x = strVal(g(s)); return x.startsWith('※') ? '' : x; };
        const hasData = ['recv','send','plan','done'].some(k=>parseDate(g(k))) || v.cols.some(c=>c.src.startsWith('sel:') && isMarked(g(c.src)));
        const nm = sv0('#name'), kn = sv0('#kana');
        if(!nm && !kn){ if(hasData) skipped++; continue; }
        const birth = parseDate(g('#birth')), key = `${normH(nm)}|${birth}`;
        famP = fam.get(key) || [...fam.values()].find(p=>normH(p.name) === normH(nm) && (!birth || !p.birth || birth === p.birth));
        if(!famP){ famP = {id:newFamId(), name:nm, kana:kn, birth, addr:sv0('#addr'), gh:sv0('#gh'), imported:true}; fam.set(key, famP); }
        pid = famP.id; noId++;
      }
      const e = newEntry(); e.pid = pid; e.created = t++;
      ['recv','send','plan','done'].forEach(k=>e[k]=parseDate(g(k)));
      e.memo = strVal(g('memo')).replace(/^※.*/,'');
      if(e.memo.startsWith('【キャンセル】')){ e.cancel = true; e.memo = e.memo.slice(7); }
      v.cols.forEach(c=>{ if(c.src.startsWith('sel:') && isMarked(g(c.src))) e.sel[c.src.slice(4)] = true; });
      const sv = s => { const x = strVal(g(s)); return x.startsWith('※') ? '' : x; };
      e.snap = masterMap.get(pid) ? {...masterMap.get(pid)} : famP ? {id:famP.id, name:famP.name, kana:famP.kana, birth:famP.birth, addr:famP.addr, gh:famP.gh} : {id:pid, name:sv('#name'), kana:sv('#kana'), birth:parseDate(g('#birth')), addr:sv('#addr'), gh:sv('#gh')};
      entries.push(e);
    }
    found.push({v, sheet:sh.name, entries, noId, skipped});
  }
  if(!found.length){ alert('取り込めるシートが見つかりませんでした。\n（シート名に「インフル」「コロナ」「帯状」「肺炎」を含み、1～5行目に「ID」の見出しがあるシートが対象です）'); return; }
  // IDはあるが、患者マスタにも患者家族マスタにもない方（IDのない行から作った方は、取込のとき必ず家族マスタに入るので除く）
  const autoIds = new Set([...fam.values()].filter(x=>x.imported).map(x=>x.id));
  const nmSet = new Set(); found.forEach(f=>f.entries.forEach(e=>{ if(!masterMap.has(e.pid) && !familyMap.has(e.pid) && !autoIds.has(e.pid) && e.snap && (e.snap.name || e.snap.kana)) nmSet.add(e.pid); }));
  const noMasterN = nmSet.size;
  openDlg('管理票の取り込み', `
    <p><b>${esc(file.name)}</b> から次のデータが見つかりました。</p>
    <table class="maptbl"><tr><th>取込</th><th>ワクチン</th><th>シート名</th><th>件数</th><th>うちIDなし<br>（ご家族等）</th><th>現在の登録</th></tr>
    ${found.map((f,i)=>`<tr><td><input type="checkbox" data-i="${i}" ${f.entries.length?'checked':''}></td><td>${esc(f.v.label)}</td><td>${esc(f.sheet)}</td><td>${f.entries.length}件</td><td>${f.noId}件${f.skipped?`<br><span class="tag warn">氏名なしで除外 ${f.skipped}件</span>`:''}</td><td>${state.entries[f.v.id].length}件</td></tr>`).join('')}</table>
    <div class="sec" style="margin-top:14px"><h3>取り込み方法</h3>
      <label><input type="radio" name="imode" value="replace" checked> 置き換える（現在の登録を消して、ファイルの内容にする）</label><br>
      <label><input type="radio" name="imode" value="append"> 追加する（現在の登録の後ろに追加する）</label><br>
      <label><input type="radio" name="imode" value="dates"> 予診票発送日・接種予定日だけを更新する（登録の追加・削除、区分・備考などは変えない）</label></div>
    <div id="iDiff" style="display:none;margin:8px 0;padding:10px;border:1px solid var(--accent);border-radius:6px;background:var(--accent-weak)">
      <label style="display:block;margin-bottom:6px"><input type="checkbox" id="iClr"> ファイルの日付が空欄のとき、現在の日付を消す（チェックしない場合、空欄は変更しません）</label>

const CRC = (() => { const t = new Uint32Array(256); for(let n = 0; n < 256; n++){ let c = n; for(let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(u8){ let c = 0xFFFFFFFF; for(let i = 0; i < u8.length; i++) c = CRC[(c ^ u8[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
function zipStore(files){
  const te = new TextEncoder(), parts = [], cd = []; let off = 0;
  const d = new Date(), dt = ((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate(), tm = (d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1);
  for(const f of files){
    const name = te.encode(f.name), data = te.encode(f.data), crc = crc32(data);
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true); lh.setUint16(4,20,true); lh.setUint16(6,0x0800,true); lh.setUint16(8,0,true);
    lh.setUint16(10,tm,true); lh.setUint16(12,dt,true); lh.setUint32(14,crc,true); lh.setUint32(18,data.length,true); lh.setUint32(22,data.length,true);
    lh.setUint16(26,name.length,true); lh.setUint16(28,0,true);
    parts.push(lh.buffer, name, data);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true); ch.setUint16(4,20,true); ch.setUint16(6,20,true); ch.setUint16(8,0x0800,true); ch.setUint16(10,0,true);
    ch.setUint16(12,tm,true); ch.setUint16(14,dt,true); ch.setUint32(16,crc,true); ch.setUint32(20,data.length,true); ch.setUint32(24,data.length,true);
    ch.setUint16(28,name.length,true); ch.setUint32(42,off,true);
    cd.push(ch.buffer, name);
    off += 30 + name.length + data.length;
  }
  const cdSize = cd.reduce((s,b)=>s + b.byteLength, 0);
  const eo = new DataView(new ArrayBuffer(22));
  eo.setUint32(0,0x06054b50,true); eo.setUint16(8,files.length,true); eo.setUint16(10,files.length,true); eo.setUint32(12,cdSize,true); eo.setUint32(16,off,true);
  return new Blob([...parts, ...cd, eo.buffer], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}

const FS_OK = typeof window.showDirectoryPicker === 'function';
const BK_PREFIX = 'ワクチン管理_バックアップ_';
let backupDir = null;
function idbOpen(){ return new Promise((res,rej)=>{ const r = indexedDB.open('vaccineKanri.fs', 1); r.onupgradeneeded = () => r.result.createObjectStore('h'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
async function idbGet(k){ const db = await idbOpen(); return new Promise((res,rej)=>{ const q = db.transaction('h').objectStore('h').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); }
async function idbPut(k, v){ const db = await idbOpen(); return new Promise((res,rej)=>{ const t = db.transaction('h','readwrite'); v === undefined ? t.objectStore('h').delete(k) : t.objectStore('h').put(v, k); t.oncomplete = () => res(); t.onerror = () => rej(t.error); }); }
const dirReady = (async () => { try{ if(FS_OK) backupDir = (await idbGet('backupDir')) || null; }catch(e){ backupDir = null; } })();
async function dirPermission(){
  if(!backupDir) return false;
  const o = {mode:'readwrite'};
  try{ return (await backupDir.queryPermission(o)) === 'granted' || (await backupDir.requestPermission(o)) === 'granted'; }catch(e){ return false; }
}

  }
}
async function writeFileTo(dir, name, data){

  await w.write(data); await w.close();
}
// 保存先を返す: 'folder'（固定フォルダ）/ 'download'（ダウンロード）
async function doBackup(){
  await dirReady;
  const d = new Date(), label = d.toLocaleString('ja-JP',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
  const data = JSON.stringify({app:'vaccineKanri', savedAt:d.toISOString(), state:{...state, lastBackup:label, dirty:false}}, null, 1);
  const name = state.settings.bkMode === 'dated' ? `${BK_PREFIX}${nowStamp()}.json` : `${BK_PREFIX.slice(0,-1)}.json`;   // 既定は固定名で上書き
  let where = 'download', note = '';
  if(backupDir){
    try{
      if(await dirPermission()){ await writeFileTo(backupDir, name, data); where = 'folder'; }
      else note = '\n保存先フォルダへの書き込みが許可されなかったため、ダウンロードで保存します。';
    }catch(e){ note = `\n保存先フォルダに書き込めなかったため、ダウンロードで保存します。（${e.message}）`; }
    if(note) alert('保存先フォルダに保存できませんでした。' + note);
  }
  if(where === 'download') download(new Blob([data], {type:'application/json'}), name);
  state.lastBackup = label; state.dirty = false; persist(false); renderHeader();
  toast(where === 'folder' ? `バックアップを保存しました（フォルダ「${backupDir.name}」）` : 'バックアップファイルを保存しました（ダウンロード）');
  return where;
}
async function restoreFromText(text){
  try{
    const obj = JSON.parse(text);
    const s = obj && obj.app === 'vaccineKanri' ? obj.state : null;
    if(!s || !s.entries || !s.master) throw new Error('このアプリのバックアップファイルではありません');
    const n = VACCINES.reduce((a,v)=>a + (s.entries[v.id]||[]).length, 0), has = state.master.list.length || VACCINES.some(v=>state.entries[v.id].length);
    if(has && !confirm(`バックアップ（${obj.savedAt ? new Date(obj.savedAt).toLocaleString('ja-JP') : '日時不明'}・接種登録 ${n}件・患者 ${s.master.list.length}名）で、現在のデータをすべて置き換えます。よろしいですか？`)) return false;
    const d = defaultState();
    state = {...d, ...s, family:{...d.family, ...(s.family||{})}, settings:{...d.settings, ...s.settings}, entries:{...d.entries, ...s.entries}, dirty:false};
    migrateExtras();   // 以前の版のバックアップに入っている手入力の患者は、患者家族マスタへ移す
    rebuildMaster(); persist(false); renderAll(); if(dlg.open) dlg.close(); toast(`バックアップから復元しました（接種登録 ${n}件・患者 ${s.master.list.length}名）`);
    return true;
  }catch(e){ alert('復元できませんでした：' + e.message); return false; }
}

    }
    files.sort((a,b)=>b.f.lastModified - a.f.lastModified);
    box.innerHTML = files.length ? `<div class="hint" style="margin-bottom:4px">フォルダ「${esc(backupDir.name)}」のバックアップ（新しい順）。選ぶと復元します。</div><div class="bulklist">${files.slice(0,12).map((x,i)=>`<label style="grid-template-columns:1fr 90px;cursor:pointer" data-i="${i}"><span>${i===0?'<span class="tag ok">最新</span> ':''}${esc(new Date(x.f.lastModified).toLocaleString('ja-JP'))}</span><span style="text-align:right">${Math.max(1,Math.round(x.f.size/1024)).toLocaleString()} KB</span></label>`).join('')}</div>`
      : `<div class="hint">フォルダ「${esc(backupDir.name)}」にバックアップファイルがありません。</div>`;
    $$('#rsList [data-i]').forEach(l=>l.onclick = async () => { await restoreFromText(await files[+l.dataset.i].f.text()); });

/* ================= トースト ================= */
let toastTimer;
function toast(msg, btn, fn){
  const t = $('#toast'); $('#toastMsg').textContent = msg;
  const b = $('#toastBtn'); b.style.display = btn ? '' : 'none'; b.textContent = btn || ''; b.onclick = () => { t.style.display='none'; fn && fn(); };
  t.style.display = 'flex'; clearTimeout(toastTimer); toastTimer = setTimeout(()=>t.style.display='none', btn ? 6000 : 3000);
}

/* ================= 接種予定者一覧・印刷 ================= */
const WD = '日月火水木金土';
const NODATE = '__none';   // 一覧で「日付が未定の方」を表す値
const fmtJ = s => { if(s === NODATE) return '日付未定'; const [y,m,d] = s.split('-').map(Number); return `${y}年${m}月${d}日（${WD[new Date(y,m-1,d).getDay()]}）`; };
// 指定日に接種予定の方を「個人宅（かな順）→施設ごと（施設名順・かな順）」に並べる
function dayGroups(v, date){
  const byKana = (a,b) => norm(a.p.kana||a.p.name).localeCompare(norm(b.p.kana||b.p.name),'ja') || String(a.e.pid).localeCompare(String(b.e.pid),'ja',{numeric:true});
  const rows = state.entries[v.id].filter(e=>(date===NODATE ? isNoPlan(e) : e.plan===date) && !e.cancel).map(e=>({e, p:patientOf(e)}));
  // 患者家族は、同じ日に対象の患者がいれば、その患者のすぐ下に置く（かな順は無視）
  const targetOf = r => r.p.rel ? rows.find(t=>t!==r && !t.p.rel && (r.p.relTo ? t.e.pid===r.p.relTo : (r.p.relToName && t.p.name===r.p.relToName))) : null;
  const attached = new Map(), main = [];
  rows.forEach(r=>{ const t = targetOf(r); if(t){ if(!attached.has(t)) attached.set(t, []); attached.get(t).push(r); } else main.push(r); });
  const withFam = list => list.sort(byKana).flatMap(r=>[r, ...(attached.get(r)||[]).sort(byKana)]);
  const home = withFam(main.filter(r=>!r.p.gh)), gmap = new Map();
  main.filter(r=>r.p.gh).forEach(r=>{ if(!gmap.has(r.p.gh)) gmap.set(r.p.gh, []); gmap.get(r.p.gh).push(r); });
  const groups = [];
  if(home.length) groups.push(['個人宅', home]);
  [...gmap.keys()].sort((a,b)=>a.localeCompare(b,'ja')).forEach(g=>groups.push([g, withFam(gmap.get(g))]));
  return {rows, groups};
}
function planListHtml(date, scope, pageBreak){
  const base = baseDate(), vs = scope==='all' ? VACCINES : [VAC[cur]];
  let total = 0; const by = [];
  let h = `<div class="pl"><h2>接種予定者一覧　${date===NODATE?'接種予定日が未定の方':esc(fmtJ(date))}</h2><div class="sub">${esc(state.settings.fy)}　並び順：個人宅（かな順）→ 施設ごと（施設名順・かな順）<br>年齢・「65歳以上」などの判定は、<b>接種日の年齢</b>です（接種日が未入力の方は接種予定日の年齢）。</div>`;
  for(const v of vs){
    const {rows, groups} = dayGroups(v, date);
    if(!rows.length) continue;
    total += rows.length; by.push(`${v.label} ${rows.length}名`);
    h +=`<h3 class="vt${pageBreak && h.includes('class="vt') ? ' pb' : ''}">${esc(v.label)}（${rows.length}名）</h3>`;
    const hasR = v.radios.length > 0;
    groups.forEach(([gname, list], gi)=>{
      h += `<h4 class="gt${pageBreak && gi>0 ? ' pb' : ''}">${esc(gname)}（${list.length}名）</h4>
        <table><thead><tr><th style="width:26px">No</th><th style="width:44px">ID</th><th>氏名</th><th style="width:44px">年齢<br>(接種日)</th><th style="width:78px">生年月日</th>${hasR?`<th>${esc(v.radios[0].g)}</th>`:''}<th>区分・確認</th><th>住所</th><th>備考</th><th style="width:34px">済</th></tr></thead><tbody>
        ${list.map(({e,p},i)=>{
          const age = vacAge(e, p, base).age, tg = [];
          if(v.auto && v.auto.test(age)) tg.push((v.auto.short||v.auto.label) + '（接種日）');
          v.flags.forEach(g=>g.items.forEach(([k,l])=>{ if(e.sel[k]) tg.push(l.replace(/（.*/,'')); }));
          return `<tr><td class="c">${i+1}</td><td>${esc(e.pid)}</td><td><b>${esc(p.name||'')}</b>${p.kana?`<span class="kn">${esc(p.kana)}</span>`:''}${p.rel?`<span class="kn" style="font-weight:700;color:#000">【家族】${esc(relText(p))}</span>`:''}</td><td class="c">${age ?? ''}</td><td>${fmtD(p.birth)}</td>${hasR?`<td>${esc(radioText(v,e))}</td>`:''}<td>${esc(tg.join('・'))}</td><td>${esc(p.addr||'')}</td><td>${esc(e.memo||'')}</td><td class="c">${e.done?'済':'<span class="chkbox"></span>'}</td></tr>`;
        }).join('')}</tbody></table>`;
    });
  }
  return total ? h + `<div class="total">合計 ${total} 名${scope==='all'&&by.length>1?`（${esc(by.join('／'))}）`:''}</div></div>` : h + `<div class="none">${date===NODATE?'接種予定日が未定の方はいません。':'この日に接種予定の方はいません。'}</div></div>`;
}
function openPlanList(){
  const pd = new Map();
  VACCINES.forEach(v=>state.entries[v.id].forEach(e=>{ if(e.plan && !e.cancel) pd.set(e.plan, (pd.get(e.plan)||0)+1); }));
  const dates = [...pd.keys()].sort(), t = todayStr(), fut = dates.filter(d=>d>=t);
  const noN = VACCINES.reduce((a,v)=>a + state.entries[v.id].filter(isNoPlan).length, 0);
  let date = fut[0] || dates[dates.length-1] || t, scope = 'cur', pb = false;
  const calCounts = () => { const m = new Map(); (scope==='all' ? VACCINES : [VAC[cur]]).forEach(v=>state.entries[v.id].forEach(e=>{ if(e.plan && !e.cancel){ const o = m.get(e.plan) || {}; o[v.id] = (o[v.id]||0)+1; m.set(e.plan, o); } })); return m; };
  openDlg('接種予定者一覧', `
    <div class="toolbar" style="margin-bottom:6px">
      <label>接種予定日 <input type="date" id="plDate" value="${date}"></label><button type="button" id="plCal" title="予定のある日と人数をカレンダーで見る">📅 カレンダー</button><button type="button" id="plNone" title="接種予定日が未入力の方の一覧（印刷もできます）">接種予定日が未定の方（全ワクチン計 ${noN}）</button>
      <label><input type="checkbox" id="plAll"> すべてのワクチン</label>
      <label><input type="checkbox" id="plPb"> 施設ごとに改ページ</label>
    </div>
    <div id="plBody" style="border:1px solid var(--line);border-radius:6px;padding:12px;background:#fff"></div>`,
    `<span class="grow"></span><button id="plClose">閉じる</button><button class="primary" id="plPrint">印刷する</button>`, 'min(1100px,96vw)');
  const draw = () => { $('#plBody').innerHTML = planListHtml(date, scope, pb); };
  $('#plDate').onchange = ev => { date = ev.target.value || t; draw(); };
  $('#plAll').onchange = ev => { scope = ev.target.checked ? 'all' : 'cur'; draw(); };
  $('#plPb').onchange = ev => { pb = ev.target.checked; draw(); };
  $('#plNone').onclick = () => { date = NODATE; draw(); };
  $('#plCal').onclick =ev => { ev.stopPropagation(); openCalPopup(ev.currentTarget, calCounts(), date, d => { date = d; $('#plDate').value = d; draw(); }, ['接種予定日カレンダー', scope==='all' ? 'すべてのワクチン' : VAC[cur].label, scope==='all']); };
  $('#plClose').onclick = () => dlg.close();
  $('#plPrint').onclick = () => { $('#printArea').innerHTML = planListHtml(date, scope, pb); window.print(); };
  draw();
}

// 患者家族マスタのExcel / CSV の読み込み（患者マスタとは別。IDが空の行は、M0001 のように自動で付ける）
const FFIELDS = [['id','ID（空欄の行は自動で付けます）'],['name','氏名'],['kana','ふりがな'],['birth','生年月日'],['addr','住所'],['gh','施設名'],['rel','続柄'],['relToName','関連する患者（患者名）']];
const FALIAS = {
  id:['id','家族id','番号'],
  rel:['続柄','続き柄','関係'],
  relToName:['関連する患者','関連患者','患者氏名','患者名','本人氏名','本人','患者'],
  kana:MALIAS.kana, birth:MALIAS.birth, gh:MALIAS.gh,
  addr:['住所','現住所','住民票住所'],
  name:['氏名','家族氏名','家族名','ご家族氏名','名前'],
};
function detectFHeader(rows){
  let best = -1, bestScore = 0;
  for(let r = 0; r < Math.min(rows.length, 15); r++){
    const hs = (rows[r]||[]).map(normH); let sc = 0;
    for(const al of Object.values(FALIAS)) if(hs.some(h=>h && al.some(a=>h===normH(a)))) sc += 2; else if(hs.some(h=>h && al.some(a=>h.includes(normH(a))))) sc += 1;
    if(sc > bestScore){ bestScore = sc; best = r; }
  }
  return best;
}
function detectFMap(rows, hr){
  const hs = hr >= 0 ? (rows[hr]||[]).map(normH) : [], map = {}, used = new Set();
  for(const f of ['id','rel','relToName','kana','birth','gh','addr','name']){
    const al = FALIAS[f].map(normH);
    let i = hs.findIndex((h,j)=>h && !used.has(j) && al.includes(h));
    if(i < 0) i = hs.findIndex((h,j)=>h && !used.has(j) && al.some(a=>h.includes(a)));
    if(i >= 0){ map[f] = i; used.add(i); }
  }
  return map;
}
function buildFamily(rows, hr, map){
  // これまでの家族と同じ方か：氏名が同じで、生年月日が同じ（どちらかが未入力でも同じとみなす）
  const findEx = (name, birth) => state.family.list.find(p=>normH(p.name) === normH(name) && (!birth || !p.birth || birth === p.birth));
  const masterByName = new Map(); state.master.list.forEach(p=>{ const k = normH(p.name); if(k && !masterByName.has(k)) masterByName.set(k, p); });
  const out = new Map(), batch = new Set(); let bad = 0, auto = 0, noBirth = 0;
  for(let r = hr + 1; r < rows.length; r++){
    const row = rows[r] || [], g = f => map[f] == null || map[f] < 0 ? null : row[map[f]];
    const name = strVal(g('name')), kana = strVal(g('kana'));
    if(!name && !kana){ if(row.some(c=>c != null && String(c).trim() !== '')) bad++; continue; }
    const birth = parseDate(g('birth'));
    let id = toIdStr(g('id'));
    if(!id){
      const ex = findEx(name, birth);
      id = ex && !batch.has(ex.id) ? ex.id : nextFamilyId(batch); auto++;
    }
    batch.add(id);
    const p = {id, name, kana, birth, addr:strVal(g('addr')), gh:strVal(g('gh'))};
    const rel = strVal(g('rel')); if(rel) p.rel = rel;
    const rn = strVal(g('relToName')); if(rn){ p.relToName = rn; const m = masterByName.get(normH(rn)); if(m) p.relTo = m.id; }
    if(!birth) noBirth++;
    out.set(id, p);
  }
  return {list:[...out.values()], bad, auto, noBirth};
}

      <div class="sec"><h3>確認（先頭5名）</h3>

        <p>読み込み件数：<b>${res.list.length.toLocaleString()}名</b>${res.auto?`　（IDを自動で付けた方 ${res.auto}名）`:''}${res.bad?`　<span class="tag warn">氏名のない行 ${res.bad}件は除外</span>`:''}</p>
        <p class="hint">${ex?`現在の患者家族マスタ（${ex.toLocaleString()}名）は、この内容に置き換わります。同じ氏名・生年月日の方には、これまでのIDを引き継ぎます。`:''}<b>患者マスタには影響しません。</b>登録済みの接種記録はそのまま残ります。</p>

/* ================= 予診票発送一覧（仙台市／仙台市以外） ================= */
function sendListHtml(date, scope, city, pageBreak){
  const base = baseDate(), vs = scope==='all' ? VACCINES : [VAC[cur]];
  const byKana = (a,b) => norm(a.p.kana||a.p.name).localeCompare(norm(b.p.kana||b.p.name),'ja') || String(a.e.pid).localeCompare(String(b.e.pid),'ja',{numeric:true});
  let total = 0, first = true, hasNow = false; const by = new Map();
  let h = `<div class="pl"><h2>予診票発送一覧　${date===NODATE?'発送日が未定の方':'発送日 '+esc(fmtJ(date))}</h2><div class="sub">${esc(state.settings.fy)}　並び順：個人宅（かな順）→ 施設ごと（施設名順・施設内はかな順）<br>年齢は<b>接種日の年齢</b>です（接種日が未入力の方は接種予定日の年齢）。</div>`;
  for(const v of vs){
    const rows = state.entries[v.id].filter(e=>(date===NODATE ? !e.send && !e.done : e.send===date) && !e.cancel).map(e=>({e, p:patientOf(e)}));
    const parts = [['仙台市', rows.filter(r=>!r.e.sel.outside).sort(byKana), 'in'], ['仙台市以外', rows.filter(r=>r.e.sel.outside).sort(byKana), 'out']]
      .filter(([,l,k])=>l.length && (city==='both' || city===k));
    if(!parts.length) continue;
    parts.forEach(([label, list], i)=>{
      total += list.length; by.set(v.label, (by.get(v.label)||0) + list.length);
      h += `<h3 class="vt${pageBreak && !first ? ' pb' : ''}">${esc(v.label)}　${esc(label)}（${list.length}名）</h3>
        <table><thead><tr><th style="width:30px">No</th><th style="width:200px">患者名</th><th style="width:60px">年齢<br>(接種日)</th><th>住所</th></tr></thead><tbody>
        ${(() => {
          // 個人宅（かな順）→ 施設ごと（施設名順・施設内はかな順）
          const home = list.filter(r=>!r.p.gh), gm = new Map();
          list.filter(r=>r.p.gh).forEach(r=>{ if(!gm.has(r.p.gh)) gm.set(r.p.gh, []); gm.get(r.p.gh).push(r); });
          const secs = [];
          if(home.length) secs.push([gm.size ? '個人宅' : '', home]);
          [...gm.keys()].sort((a,b)=>a.localeCompare(b,'ja')).forEach(g=>secs.push([g, gm.get(g)]));
          let n = 0;
          return secs.map(([g, rs])=>(g ? `<tr class="grp"><td colspan="4">${esc(g)}（${rs.length}名）</td></tr>` : '') + rs.map(({e,p})=>{ const va = vacAge(e, p, base), a = va.age; if(va.basis==='now' && a != null) hasNow = true;
            return `<tr><td class="c">${++n}</td><td><b>${esc(p.name||'')}</b>${p.kana?`<span class="kn">${esc(p.kana)}</span>`:''}</td><td class="c">${a ?? ''}${va.basis==='now' && a != null ? '*' : ''}</td><td>${esc(p.addr||'')}</td></tr>`; }).join('')).join('');
        })()}</tbody></table>`;
      first = false;
    });
  }
  return total ? h + `<div class="total">合計 ${total} 名${scope==='all'&&by.size>1?`（${esc([...by].map(([k,n])=>`${k} ${n}名`).join('／'))}）`:''}</div>${hasNow?'<div class="sub">* 接種日・接種予定日が未入力のため、現在の年齢です。</div>':''}</div>` : h + `<div class="none">${date===NODATE?'発送日が未定の方はいません。':'この発送日の対象者はいません。'}</div></div>`;
}
function openSendList(){

  VACCINES.forEach(v=>state.entries[v.id].forEach(e=>{ if(e.send && !e.cancel) sd.set(e.send, (sd.get(e.send)||0)+1); }));
  const dates = [...sd.keys()].sort(), t = todayStr(), fut = dates.filter(d=>d>=t);
  const noN = VACCINES.reduce((a,v)=>a + state.entries[v.id].filter(e=>!e.send && !e.done && !e.cancel).length, 0);

      <label><input type="radio" name="slCity" value="in"> 仙台市のみ</label>

      <label><input type="checkbox" id="slPb" checked> 区分ごとに改ページ</label>
    </div>

  const draw = () => { $('#slBody').innerHTML = sendListHtml(date, scope, city, pb); };
  $('#slDate').onchange = ev => { date = ev.target.value || t; draw(); };
  $('#slAll').onchange = ev => { scope = ev.target.checked ? 'all' : 'cur'; draw(); };
  $$('#dlgBody input[name=slCity]').forEach(r=>r.onchange=()=>{ city = r.value; draw(); });
  $('#slPb').onchange = ev => { pb = ev.target.checked; draw(); };
  $('#slNone').onclick = () => { date = NODATE; draw(); };
  $('#slCal').onclick =ev => { ev.stopPropagation(); openCalPopup(ev.currentTarget, calCounts(), date, d => { date = d; $('#slDate').value = d; draw(); }, ['予診票発送日カレンダー', scope==='all' ? 'すべてのワクチン' : VAC[cur].label, scope==='all']); };
  $('#slClose').onclick = () => dlg.close();
  $('#slPrint').onclick = () => { $('#printArea').innerHTML = sendListHtml(date, scope, city, pb); window.print(); };
  draw();
}

/* ================= 接種日当日の完了入力 ================= */
function openDayDone(){
  let date = todayStr(), onlyCur = false;
  openDlg('接種完了の入力', `
    <div class="toolbar" style="margin-bottom:6px">
      <label>接種日 <input type="date" id="ddDate" value="${date}"></label>
      <label><input type="checkbox" id="ddCur"> ${esc(VAC[cur].label)}のみ表示</label>
      <button class="small" id="ddAll">未接種を全員選択</button><button class="small" id="ddNone">選択解除</button>
    </div>
    <div class="hint" style="margin-bottom:6px">接種予定日がこの日の方を表示しています（キャンセルした方は除く）。接種が終わった方にチェックを入れて「接種完了にする」を押すと、接種日が入ります。年齢は、この接種日の年齢です。</div>
    <div id="ddBody"></div>`,
    `<span class="grow"></span><button id="ddClose">閉じる</button><button class="primary" id="ddOk" disabled>接種完了にする</button>`, 'min(960px,96vw)');
  const draw = () => {
    const keep = new Set($$('#ddBody input.dd:checked').map(c=>c.value));
    const vs = onlyCur ? [VAC[cur]] : VACCINES, base = baseDate(); let n = 0, h = '';
    for(const v of vs){
      const {rows, groups} = dayGroups(v, date); if(!rows.length) continue; n += rows.length;
      h += `<h3 class="vt" style="font-size:15px;margin:12px 0 4px;padding:3px 8px;background:#e9eef3">${esc(v.label)}（${rows.length}名）</h3>`;
      groups.forEach(([gname, list])=>{
        h += `<h4 style="font-size:14px;margin:8px 0 2px;padding:2px 6px;border-left:4px solid var(--accent)">${esc(gname)}（${list.length}名）</h4><div class="bulklist" style="max-height:none">` +
          list.map(({e,p})=>{ const a = ageAt(p.birth, e.done || date), done = !!e.done;
            return `<label class="${done?'dis':''}" style="grid-template-columns:24px 80px 1fr 60px 150px"><input type="checkbox" class="dd" value="${v.id}|${e.id}" ${done?'disabled':(keep.has(v.id+'|'+e.id)?'checked':'')}>
              <span>${esc(e.pid)}</span><span><span class="nm">${esc(p.name||'')}</span><span class="kana">${esc(p.kana||'')}</span></span>
              <span>${a ?? ''}${a!=null?'歳':''}</span><span>${done?`<span class="done">接種済 ${fmtD(e.done)}</span>`:esc(radioText(v,e))}</span></label>`; }).join('') + '</div>';
      });
    }
    $('#ddBody').innerHTML = n ? h : `<div class="empty" style="padding:30px">${esc(fmtJ(date))}に接種予定の方はいません。</div>`;
    upd();
  };
  const upd = () => { const k = $$('#ddBody input.dd:checked').length; $('#ddOk').disabled = !k; $('#ddOk').textContent = k ? `${k}名を接種完了にする` : '接種完了にする'; };
  $('#ddBody').onchange = upd;
  $('#ddDate').onchange = ev => { date = ev.target.value || todayStr(); draw(); };
  $('#ddCur').onchange = ev => { onlyCur = ev.target.checked; draw(); };
  $('#ddAll').onclick = () => { $$('#ddBody input.dd:not(:disabled)').forEach(c=>c.checked=true); upd(); };
  $('#ddNone').onclick = () => { $$('#ddBody input.dd').forEach(c=>c.checked=false); upd(); };
  $('#ddClose').onclick = () => dlg.close();
  $('#ddOk').onclick = () => {
    const targets = $$('#ddBody input.dd:checked').map(c=>{ const [vid, id] = c.value.split('|'); return state.entries[vid].find(e=>e.id===id); }).filter(Boolean);
    targets.forEach(e=>e.done = date); persist(); renderAll(); dlg.close();
    toast(`${targets.length}名を接種完了にしました（接種日 ${fmtD(date)}）`, '元に戻す', ()=>{ targets.forEach(e=>e.done=''); persist(); renderAll(); });
  };
  draw();
}
